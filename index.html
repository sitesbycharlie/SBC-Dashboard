*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
#app{position:relative;background-color:#000000;max-width:1440px;margin:0 auto;padding:22px;min-height:100vh;overflow:hidden;
 background-image:linear-gradient(rgba(216,64,64,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(216,64,64,.05) 1px,transparent 1px),radial-gradient(ellipse at 50% 0%,rgba(142,22,22,.35),transparent 60%);
 background-size:32px 32px,32px 32px,100% 100%}
#app::before{content:"";position:absolute;inset:0;pointer-events:none;background-image:repeating-linear-gradient(0deg,rgba(255,255,255,.018) 0,rgba(255,255,255,.018) 1px,transparent 1px,transparent 3px);z-index:0}
#app>*{position:relative;z-index:1}
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
.kicker{color:var(--red);font-size:11px;letter-spacing:.22em;font-weight:700;text-transform:uppercase}
h1{font-size:32px;font-weight:800;letter-spacing:-.02em;margin:4px 0 0}
h1 span{color:var(--red);text-shadow:0 0 18px rgba(216,64,64,.6)}
.stats{display:flex;flex-wrap:wrap;gap:10px;font-size:12px;align-items:center}
.btn{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font:inherit;font-size:12px;cursor:pointer}
.btn:hover{border-color:var(--red)}
.btn.on{border-color:var(--red);color:#EEEEEE;background:rgba(216,64,64,.12);box-shadow:0 0 12px rgba(216,64,64,.35)}
.feed{margin-top:14px;display:flex;flex-wrap:wrap;align-items:center;gap:10px;background:rgba(0,0,0,.6);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:13px}
.feed .live{color:var(--red);font-weight:800;letter-spacing:.14em;font-size:11px;animation:blink 1.6s infinite}
@keyframes blink{50%{opacity:.35}}
#feedText{flex:1 1 200px;min-width:0;transition:opacity .3s}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin-top:16px}
.tab{background:transparent;color:var(--muted);border:1px solid var(--line);border-radius:10px;padding:8px 14px;font:inherit;font-size:13px;font-weight:600;cursor:pointer}
.tab:hover{color:var(--ink);border-color:var(--red)}
.tab.active{color:#EEEEEE;background:linear-gradient(135deg,var(--crimson),var(--red));border-color:var(--red);box-shadow:0 0 16px rgba(216,64,64,.45)}
.view{display:none;margin-top:16px}.view.active{display:block}
.row{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-start}
.chart{flex:3 1 600px;min-width:0}
.panel{flex:1 1 300px;min-width:0;background:var(--panel);border:1px solid var(--red);border-radius:16px;padding:18px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid;border-radius:999px;padding:2px 10px;font-size:11px;font-weight:700;letter-spacing:.06em}
.chip i{width:7px;height:7px;border-radius:7px;display:inline-block}
.lbl{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;font-weight:700;margin:14px 0 6px}
.li{display:flex;gap:8px;font-size:13px;line-height:1.45;margin-bottom:4px}
.now{margin-top:14px;background:rgba(0,0,0,.55);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.hint{color:var(--faint);font-size:11px;margin-top:6px}
.cards{display:flex;flex-wrap:wrap;gap:14px;margin-top:20px}
.card{flex:1 1 280px;min-width:0;background:var(--panel);border:1px solid var(--line);border-top:2px solid var(--c,var(--red));border-radius:14px;padding:14px 16px;box-shadow:0 0 24px rgba(216,64,64,.08)}
.card h3{color:var(--c,var(--red));font-size:11px;letter-spacing:.16em;text-transform:uppercase;font-weight:700;margin:0 0 12px}
.small{font-size:12px;color:var(--muted);line-height:1.55}
.big{font-size:30px;font-weight:800}
.gauges{display:flex;flex-wrap:wrap;gap:6px}
.gauge{flex:1 1 110px;min-width:110px;text-align:center}
.gauge svg{max-width:150px;display:block;margin:0 auto}
.bar{height:10px;border-radius:10px;background:rgba(238,238,238,.08);overflow:hidden;margin-top:8px}
.bar>div{height:100%;background:linear-gradient(90deg,var(--crimson),var(--red))}
.days{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.day{flex:1 1 52px;background:rgba(0,0,0,.55);border:1px solid var(--line);border-radius:8px;padding:6px 4px;text-align:center}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--panel)}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;color:var(--muted);font-weight:600;font-size:11px;letter-spacing:.08em;text-transform:uppercase;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:#000000;position:sticky;top:0}
td{padding:8px 12px;border-bottom:1px solid rgba(238,238,238,.06);vertical-align:top}
tr:hover td{background:rgba(142,22,22,.10)}
.num{text-align:right;font-variant-numeric:tabular-nums}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 12px}
select,input[type=search]{background:#000000;color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:7px 10px;font:inherit;font-size:13px}
.pill{display:inline-block;border:1px solid;border-radius:999px;padding:1px 8px;font-size:11px;font-weight:600;white-space:nowrap}
.tot{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:12px}
.tot div{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 12px;min-width:110px}
.tot b{display:block;font-size:22px}
.tot span{font-size:11px;color:var(--muted)}
.opp{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--c,var(--red));border-radius:12px;padding:14px 16px;flex:1 1 300px;min-width:0}
.opp h4{margin:0 0 4px;font-size:17px}
.kv{display:grid;grid-template-columns:90px 1fr;gap:4px 10px;font-size:13px;margin-top:10px}
.kv dt{color:var(--muted)}.kv dd{margin:0}
.sec{font-size:13px;color:var(--red);border-bottom:1px solid rgba(216,64,64,.35);padding-bottom:6px;letter-spacing:.16em;text-transform:uppercase;font-weight:700;margin:22px 0 10px}
.hid{color:var(--faint);letter-spacing:.1em}
.foot{color:var(--faint);font-size:11px;margin-top:18px;line-height:1.5}

/* ===== Dark glassmorphism layer ===== */
body{background:#000000}
#app{background-color:transparent}
.backdrop{position:fixed;inset:0;z-index:-1;background:#000000;overflow:hidden}
.backdrop i{position:absolute;border-radius:50%;filter:blur(90px);opacity:.55}
.backdrop i:nth-child(1){width:520px;height:520px;left:-120px;top:-160px;background:#8E1616}
.backdrop i:nth-child(2){width:420px;height:420px;right:-100px;top:30%;background:#D84040;opacity:.28}
.backdrop i:nth-child(3){width:600px;height:600px;left:30%;bottom:-320px;background:#8E1616;opacity:.35}
.glass,.panel,.card,.opp,.tbl-wrap,.tot div,.feed,.day,.now,.roster .bot{background:rgba(255,255,255,.045)!important;-webkit-backdrop-filter:blur(16px) saturate(140%);backdrop-filter:blur(16px) saturate(140%);border:1px solid rgba(255,255,255,.10);box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 8px 32px rgba(0,0,0,.45)}
.tab,.btn,select,input[type=search]{background:rgba(255,255,255,.05)!important;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-color:rgba(255,255,255,.12)}
.tab.active{background:linear-gradient(135deg,rgba(142,22,22,.85),rgba(216,64,64,.85))!important}
th{background:rgba(0,0,0,.55)}
.chartglass{border-radius:18px;padding:10px;background:rgba(255,255,255,.025);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.08)}
.roster{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px;margin-top:18px}
.roster .bot{border-radius:14px;padding:12px 14px;cursor:pointer;border-left:3px solid var(--c)}
.roster .bot:hover{border-color:rgba(216,64,64,.6)}
.roster .bn{display:flex;justify-content:space-between;gap:8px;align-items:center;font-weight:700}
.wf{margin-top:8px}
.wf .chartglass{padding:14px 10px 8px}
@media (max-width:759px){.wf svg{min-height:720px}}
.roster .bs{font-size:10px;font-weight:700;letter-spacing:.08em}
.roster .bl{font-size:12px;color:var(--muted);margin-top:4px;line-height:1.4}
.badge{display:inline-block;border-radius:999px;padding:2px 8px;font-size:10px;font-weight:800;letter-spacing:.1em}
.badge.stale{background:rgba(216,64,64,.18);color:#ff8a8a;border:1px solid #D84040}
.badge.live{background:rgba(114,201,146,.12);color:#72c992;border:1px solid rgba(114,201,146,.5)}
.badge.emb{background:rgba(238,238,238,.06);color:rgba(238,238,238,.7);border:1px solid rgba(238,238,238,.2)}
@media (max-width:759px){#app{padding:14px}h1{font-size:24px}.kv{grid-template-columns:80px 1fr}}

/* ===== Jarvis HUD upgrade ===== */
html,body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.mono,.kicker,.sec,.lbl,.tab,.badge,.chip,.roster .bs,th,.hud-clock,.sys-ok,.sys-ticker,.boot-kicker,.boot-log,.hero-lab{font-family:"Share Tech Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
h1,.boot-title,.hero-val{font-family:Orbitron,system-ui,sans-serif}
#hudbg{position:fixed;inset:0;z-index:0;width:100%;height:100%;pointer-events:none;display:block}
.backdrop{z-index:0}
#app{z-index:1;background-color:transparent;max-width:1480px}
.scanlines{position:fixed;inset:0;z-index:2;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(255,255,255,.028) 0,rgba(255,255,255,.028) 1px,transparent 1px,transparent 3px);mix-blend-mode:overlay;opacity:.45}
.hud-top{display:flex;flex-wrap:wrap;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:8px}
.kicker{color:var(--red);font-size:11px;letter-spacing:.28em;font-weight:700;text-transform:uppercase;text-shadow:0 0 10px rgba(216,64,64,.45)}
h1{font-size:clamp(22px,4vw,38px);font-weight:800;letter-spacing:.06em;margin:6px 0 0;line-height:1.15;text-transform:uppercase}
h1 .em{color:var(--red);text-shadow:0 0 22px rgba(216,64,64,.75),0 0 4px rgba(216,64,64,.8)}
h1 .dash{color:rgba(238,238,238,.35);font-weight:500;padding:0 .15em}
.hud-clock{text-align:right;min-width:200px}
#clock{font-size:28px;font-weight:700;letter-spacing:.12em;color:#EEEEEE;text-shadow:0 0 16px rgba(216,64,64,.55);line-height:1}
#clockDate{color:var(--muted);font-size:11px;letter-spacing:.14em;margin-top:6px;text-transform:uppercase}
.sys-ok{display:inline-flex;align-items:center;gap:8px;margin-top:8px;color:#72c992;font-size:11px;letter-spacing:.18em}
.sys-ok i{width:8px;height:8px;border-radius:8px;background:#72c992;box-shadow:0 0 10px #72c992;animation:pulseok 1.6s ease-in-out infinite}
@keyframes pulseok{50%{opacity:.35;box-shadow:0 0 2px #72c992}}
.hero{display:flex;flex-wrap:wrap;gap:14px;align-items:stretch;margin:14px 0 10px;position:relative}
.hero:before{content:"";position:absolute;left:50%;top:50%;width:280px;height:280px;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle,rgba(216,64,64,.18) 0%,rgba(142,22,22,.08) 40%,transparent 70%);pointer-events:none;z-index:0;animation:reactor 8s linear infinite}
@keyframes reactor{to{transform:translate(-50%,-50%) rotate(360deg)}}
.hero-ring{position:relative;z-index:1;flex:1 1 180px;min-width:160px;text-align:center;padding:12px 8px 14px;border-radius:16px;transition:transform .2s ease,box-shadow .2s ease}
.hero-ring svg{display:block;margin:0 auto;max-width:150px;filter:drop-shadow(0 0 8px rgba(216,64,64,.45))}
.hero-lab{color:var(--red);font-size:10px;letter-spacing:.2em;margin-top:6px;text-transform:uppercase}
.hero-sub{color:var(--faint);font-size:11px;margin-top:2px}
.sys-ticker-wrap{overflow:hidden;border:1px solid rgba(216,64,64,.28);border-radius:10px;background:rgba(0,0,0,.45);margin:8px 0 4px;padding:7px 0;mask-image:linear-gradient(90deg,transparent,transparent 1%,#000 6%,#000 94%,transparent 99%)}
.sys-ticker{display:flex;gap:0;white-space:nowrap;color:var(--muted);font-size:11px;letter-spacing:.08em;animation:marquee 48s linear infinite}
.sys-ticker b{color:var(--red);font-weight:700}
.sys-ticker .ok{color:#72c992}.sys-ticker .wait{color:#fbbf24}.sys-ticker .idle{color:var(--faint)}
@keyframes marquee{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.stats{margin-top:10px}
.feed{border-color:rgba(216,64,64,.28)!important;box-shadow:0 0 18px rgba(216,64,64,.12)}
.tab{letter-spacing:.1em;text-transform:uppercase;font-size:11px;border-radius:8px;transition:transform .15s ease,box-shadow .15s ease,background .15s ease,color .15s ease}
.tab:hover{transform:translateY(-1px);box-shadow:0 0 12px rgba(216,64,64,.25)}
.view{display:none;margin-top:16px;opacity:0}
.view.active{display:block;animation:hudIn .34s ease forwards}
@keyframes hudIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.card,.opp,.roster .bot,.panel{transform-style:preserve-3d;transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease}
.holo-hot{box-shadow:0 18px 40px rgba(0,0,0,.45),0 0 24px rgba(216,64,64,.2)!important}
.roster .bot:hover,.card:hover,.opp:hover{border-color:rgba(216,64,64,.55)}
.boot{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 40%,rgba(142,22,22,.45),#000 65%);transition:opacity .4s ease}
.boot.off{opacity:0;pointer-events:none}
.boot-inner{text-align:center;padding:24px}
.boot-kicker{color:var(--red);letter-spacing:.32em;font-size:12px}
.boot-title{font-size:clamp(28px,6vw,54px);font-weight:800;letter-spacing:.14em;margin:10px 0 22px;text-shadow:0 0 28px rgba(216,64,64,.7)}
.boot-bar{width:min(320px,70vw);height:4px;margin:0 auto 14px;background:rgba(238,238,238,.1);border-radius:4px;overflow:hidden}
.boot-bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#8E1616,#D84040,#ffd0d0);box-shadow:0 0 12px #D84040;animation:bootfill 1s ease forwards}
@keyframes bootfill{to{width:100%}}
.boot-log{color:var(--muted);letter-spacing:.14em;font-size:12px;min-height:1.4em}
.boot .btn{margin-top:18px}
@media (prefers-reduced-motion:reduce){
  .hero:before,.sys-ok i,.sys-ticker,.boot-bar i,.tab,.view.active,.scanlines{animation:none!important}
  .sys-ticker{transform:none;flex-wrap:wrap;white-space:normal;justify-content:center}
  .view.active{opacity:1;transform:none}
  .scanlines{opacity:.2}
  #hudbg{display:none}
}
@media (max-width:759px){
  .hud-clock{text-align:left;min-width:0}
  #clock{font-size:20px}
  h1{font-size:20px;letter-spacing:.04em}
  .hero{flex-wrap:nowrap;align-items:center;gap:4px;margin:6px 0 4px;min-height:0;max-height:130px}
  .hero:before{width:64px;height:64px;opacity:.5}
  .hero-ring{flex:1 1 0;min-width:0;padding:2px 0 4px;border-radius:12px}
  .hero-ring svg{width:72px;height:72px;max-width:72px}
  .hero-lab{font-size:8px;letter-spacing:.08em;margin-top:1px;line-height:1.2}
  .hero-sub{font-size:8px;line-height:1.2;margin-top:0}
  .sys-ticker-wrap{mask-image:none;margin:6px 0 2px}
  .hud-top{margin-bottom:2px}
}

</style>
</head>

function startHudBg(){
  var c=$("hudbg"); if(!c||!c.getContext||reduceMotion()){if(c)c.style.display="none"; return;}
  var ctx=c.getContext("2d"), pts=[], running=true, last=0;
  function resize(){c.width=window.innerWidth; c.height=window.innerHeight;}
  resize(); window.addEventListener("resize", resize);
  var n=window.innerWidth<760?28:48;
  for(var i=0;i<n;i++)pts.push({x:Math.random()*c.width,y:Math.random()*c.height,vx:(Math.random()-0.5)*0.18,vy:(Math.random()-0.4)*0.22,r:Math.random()*1.4+0.4});
  document.addEventListener("visibilitychange",function(){running=!document.hidden; if(running)requestAnimationFrame(draw);});
  function draw(ts){
    if(!running)return;
    if(ts-last<33){requestAnimationFrame(draw);return;}
    last=ts;
    var w=c.width,h=c.height;
    ctx.clearRect(0,0,w,h);
    var gy=((ts/60)%36);
    ctx.strokeStyle="rgba(216,64,64,0.07)"; ctx.lineWidth=1;
    for(var y=gy;y<h;y+=36){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(w,y);ctx.stroke();}
    for(var x=0;x<w;x+=36){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,h);ctx.stroke();}
    var scan=(ts/8)%h;
    ctx.fillStyle="rgba(216,64,64,0.05)"; ctx.fillRect(0,scan,w,18);
    ctx.fillStyle="rgba(216,64,64,0.7)";
    pts.forEach(function(p){
      p.x+=p.vx; p.y+=p.vy;
      if(p.x<0)p.x=w; if(p.x>w)p.x=0; if(p.y<0)p.y=h; if(p.y>h)p.y=0;
      ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2); ctx.fill();
    });
    requestAnimationFrame(draw);
  }
  requestAnimationFrame(draw);
}

  else h+=table(["Business","Opportunity","Target day","Purpose","Status","Notes"], v.map(function(x){return [esc(x.business||""),esc(x.opportunity||""),esc(x.targetDay||""),esc(x.purpose||""),pill(x.status||"", x.status==="Done"?T.green:x.status==="Skipped"?C.muted:T.red),esc(x.notes||"")];}));
  if(note)h+='<div class="hint">'+esc(note)+'</div>';
  el.innerHTML=h;
}
function renderAll(){renderHero();renderOrg();renderPipeline();renderOutreach();renderHistory();renderSendPlan();renderClients();renderOpps();renderVisits();renderRevenue();renderSysTicker();}
function checkLayout(){var m=window.innerWidth<760;if(m!==mobile){mobile=m;renderHero();renderOrg();}}

var h0=(location.hash||"").replace("#","");if(TABS.some(function(t){return t[0]===h0;}))tab=h0;
$("foot").textContent=D.footer;
mobile=window.innerWidth<760;
renderStats();renderTabs();renderAll();showView();renderFeed();
tickClock(); startBoot(); startHudBg(); bindTilt();
setInterval(tickClock, 1000);
function loadData(){
  if(!window.fetch)return;
  fetch("data.json?t="+Date.now(),{cache:"no-store"}).then(function(r){if(!r.ok)throw new Error("HTTP "+r.status);return r.json();}).then(function(d){
    if(!d||!d.bots||!d.groups||!d.prospects||!d.history)throw new Error("bad shape");
    var s=JSON.stringify(d);src="live";loadedAt=new Date();
    if(s!==lastJson){lastJson=s;applyData(d);$("foot").textContent=D.footer;renderAll();showView();renderFeed();}
    renderStats();
  }).catch(function(){loadedAt=new Date();renderStats();});
}
loadData();
setInterval(loadData,10*60*1000);
window.addEventListener("resize",checkLayout);
setInterval(function(){tick++;renderFeed();updateActs();var nt=$("nowText");if(nt){var b=BOTS[hover||sel]||BOTS.chief;nt.textContent=b.acts[tick%b.acts.length];}},3200);
setInterval(function(){updateLoaded();var st=isStale();if(st!==lastStale){lastStale=st;renderStats();}},30000);
var lastStale=isStale();
})();
